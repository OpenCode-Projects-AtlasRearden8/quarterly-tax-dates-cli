[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quarterly-tax-dates-cli"
version = "1.0.0"
description = "Offline CLI that computes US quarterly estimated-tax due dates, prints a dated countdown checklist, and exports .ics calendar files. Pure stdlib."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Asdale Dynamics, LLC" }]
keywords = ["taxes", "estimated-tax", "deadlines", "calendar", "ics", "offline", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Accounting",
]

[project.scripts]
quarterly-tax-dates = "quarterly_tax_dates.cli:main"

[project.urls]
Homepage = "https://dylanasdale.github.io"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["quarterly_tax_dates"]

[tool.setuptools.package-data]
quarterly_tax_dates = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
